services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kikolink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kikolink"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kikolink?schema=public
      SESSION_SECRET: change-this-in-production
      OWNER_USERNAME: KikoEnakTau
      OWNER_PASSWORD: change-this-in-production
      NODE_ENV: production
      DISCORD_URL: https://discord.gg/U6sFp89fFa
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
